<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Flow</title>
    <link rel="stylesheet" href="Q1 StudyFlow.css">
</head>
<body>
    <div class="nav">
        <h2 class="logo">Study<span class='hh'>Flow</span></h2>
        <div class="links">
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">Help</a>
        </div>
    </div>
    <div class="bdy">
        <div class="left">
            <h1 class="hero">Study smarter, <br>not longer.</h1>
            <h3 class="subtext">Plan your week, track your courses and never miss a<br> deadline. Trusted by 5,000+ students.</h3>
            <ul>
                <li class="mod">Smart weekly planner</li>
                <li class="mod">Deadline reminders</li>
                <li class="mod">Course progress tracking</li>
            </ul>
            <div class="btn">
                <button class="btn1">Get Started</button>
                <button class="btn2">Watch Video</button>
            </div>
        </div>
        <div class = 'frm'>
            <h3 style="color: red;">Start Free Trial</h3>
            <form class="inside">
                <label>Student Name</label>
                <input type="text" placeholder="Your Name">
                <label>University Email</label>
                <input type="email" placeholder="you@uiu.ac.bd">
                <label>Password</label>
                <input type="password" placeholder="Create a password">
                <label><input type='checkbox' required></label>
                <p style="color: gray;">I agree to the <a href="#"><u>terms</u></a></p>
                <button class="crt">Create Account</button>
            </form>
        </div>
    </div>
