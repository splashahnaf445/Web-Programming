<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="FormDemo.css">
</head>
<body>
    <form class="forma">
        <label class="lbl">Full name</label>
        <input type="text" placeholder = 'Enter Full Name'>
        <label class="lbl">Password</label>
        <input type="password" placeholder="Enter Password">
        <label><input type="checkbox" unchecked>I agree to the terms of service</label>
        <button class="btn">Register</button>
    </form>
    <label>Deployment Zone</label>
    <select>
    <option>North America (East)</option>
    <option>Europe (West)</option>
    <option>Asia (South)</option>
    </select>

<label>System Description</label>
<textarea rows="4" placeholder="Describe this server..."></textarea>
    
</body>
</html>
